<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias de Segurança</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --text-color: #333;
            --bg-color: #f4f6f9;
            --card-bg: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 12px;
            background-color: var(--bg-color);
            margin: 0;
            color: var(--text-color);
        }

        .news-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .news-item {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid var(--accent-color);
            display: flex;
            flex-direction: column;
        }

        .news-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .news-item-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .news-item-title a {
            text-decoration: none;
            color: var(--primary-color);
            transition: color 0.2s;
        }

        .news-item-title a:hover {
            color: var(--accent-color);
        }

        .news-item-meta {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .news-item-description {
            font-size: 13px;
            color: #555;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }

        .error {
            text-align: center;
            padding: 20px;
            color: #e74c3c;
            font-size: 14px;
            background: #fff;
            border-radius: 8px;
        }

        .retry-btn {
            background: none;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
            font-size: 12px;
        }

        .retry-btn:hover {
            background: #e74c3c;
            color: white;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }
    </style>
</head>
<body>
    <div id="news-container" class="news-container">
        <div class="loading">Carregando notícias de segurança...</div>
    </div>

    <script>
        const API_URL = 'https://api.rss2json.com/v1/api.json?rss_url=https://feeds.feedburner.com/TheHackersNews';
        const CONTAINER = document.getElementById('news-container');

        // Function to format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(date);
        }

        // Fetch news
        async function fetchNews() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Falha na rede');

                const data = await response.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    renderNews(data.items.slice(0, 5)); // Show top 5 items
                } else {
                    throw new Error('Nenhuma notícia encontrada');
                }
            } catch (error) {
                console.error('Erro ao buscar notícias:', error);
                showError();
            }
        }

        function renderNews(items) {
            CONTAINER.innerHTML = '';

            items.forEach(item => {
                const newsItem = document.createElement('div');
                newsItem.className = 'news-item';

                // Extract a plain text snippet from content if description is empty or HTML
                // rss2json usually returns 'description' or 'content'
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = item.description || '';
                const cleanDesc = tempDiv.textContent || tempDiv.innerText || '';
                const finalDesc = cleanDesc.length > 120 ? cleanDesc.substring(0, 120) + '...' : cleanDesc;

                newsItem.innerHTML = `
                    <div class="news-item-title">
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
                    </div>
                    <div class="news-item-meta">
                        <span>📅 ${formatDate(item.pubDate)}</span>
                        <span>• The Hacker News</span>
                    </div>
                    <div class="news-item-description">
                        ${finalDesc}
                    </div>
                `;

                CONTAINER.appendChild(newsItem);
            });
        }

        function showError() {
            CONTAINER.innerHTML = `
                <div class="error">
                    Não foi possível atualizar as notícias. Verifique sua conexão.
                    <br>
                    <button class="retry-btn" onclick="fetchNews()">Tentar novamente</button>
                </div>
            `;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchNews);
    </script>
</body>
</html>
